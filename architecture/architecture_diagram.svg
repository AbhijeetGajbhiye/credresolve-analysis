<text x="250" y="578" font-size="12" fill="#16233B" text-anchor="start" font-weight="400" >Lineage: every Golden-layer row carries _source_table, _pipeline_run_id, _cleaning_rule_version — any dashboard number traces back to its raw rows and cleaning decision.</text>
<text x="250" y="600" font-size="12" fill="#16233B" text-anchor="start" font-weight="400" >Late-arriving data: Golden partitions stay open 48h before finalizing; upsert-by-id (not append-only) so a late call_disposition still attaches to its call.</text>
<text x="250" y="622" font-size="12" fill="#16233B" text-anchor="start" font-weight="400" >Backfills: a changed cleaning rule re-runs Staging &#8594; Golden for the affected date range; it never patches Golden directly, or lineage breaks.</text>
